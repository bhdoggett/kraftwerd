<!--
  The K as the header's mark shows it: a Royal Gold tile sitting in its
  square on the dark board, with the squares around it cut off by the edge
  of the picture. The board's own proportions -- a hairline of grid at 1/36
  of a square, an edge drawn inside the tile at 3/34 of one -- so this is
  the game zoomed in, not a drawing of it.

  The letter is Readex Pro Bold's K as an outline, not text: an SVG favicon
  is drawn as an image and cannot load the web font, so text here fell back
  to whatever the system had. Cap height is 0.41 of the tile, as in the
  header. Regenerate the path from the font if the face changes.

  Zoomed out far enough to leave a margin of board on every side: at 180px on
  an iPhone home screen the corners are rounded away, and it is board that
  gets rounded rather than the tile's own corners.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <!-- The grid lines are this showing through the gaps between squares:
       dark theme's --cell-line, Pacific at 30% on black. -->
  <rect width="180" height="180" fill="#0d373d"/>

  <!-- The eight squares around it, cropped: dark theme's --cell-empty. -->
  <g fill="#060608">
    <rect x="-124" y="-124" width="140" height="140"/>
    <rect x="20" y="-124" width="140" height="140"/>
    <rect x="164" y="-124" width="140" height="140"/>
    <rect x="-124" y="20" width="140" height="140"/>
    <rect x="164" y="20" width="140" height="140"/>
    <rect x="-124" y="164" width="140" height="140"/>
    <rect x="20" y="164" width="140" height="140"/>
    <rect x="164" y="164" width="140" height="140"/>
  </g>

  <!-- The tile: seat 2's Royal Gold, its edge drawn inside the square. -->
  <rect x="20" y="20" width="140" height="140" fill="#000000"/>
  <rect x="32" y="32" width="116" height="116" fill="#fed766"/>
  <!-- Font units (1000 upm, y up) scaled to a 60px cap, centred on the tile. -->
  <path transform="translate(54.686 120) scale(0.085714 -0.085714)" fill="#0b0b0d"
        d="M214 205 170 350 516 700H719ZM87 0V700H258V0ZM537 0 278 342 393 441 737 0Z"/>
</svg>
