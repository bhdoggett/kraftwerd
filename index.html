<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/index.css" />
    <title>kraftwerd</title>
    <meta name="description" content="Build word squares against your friends." />
    <!--
      iOS reads text looking for phone numbers, dates and addresses and turns
      what it finds into links — and a grid of short uppercase words is exactly
      what that heuristic mistakes for data. Off, all of it: nothing in this
      game is ever a phone number.
    -->
    <meta
      name="format-detection"
      content="telephone=no, date=no, address=no, email=no"
    />
    <!--
      What a messaging app draws when someone shares a link. Its crawler does
      not run JavaScript, so these have to be in the served HTML rather than
      set by the app — which also means every link shows the same card, invite
      links included.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="kraftwerd" />
    <meta property="og:title" content="Play kraftwerd with me" />
    <meta property="og:description" content="Build word squares against your friends." />
    <meta property="og:url" content="https://kraftwerd.benapps.xyz" />
    <!-- Absolute, and a raster: crawlers resolve it outside the page and
         several will not render an SVG. -->
    <meta property="og:image" content="https://kraftwerd.benapps.xyz/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Two tiles played side by side on the board, a lime K and a magenta W, above the word kraftwerd" />
    <!-- The words live here rather than in the picture: Slack, Discord and most
         mail clients render these as text, and a card whose message is baked
         into a PNG says nothing when the image does not load. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#3f6f52" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
