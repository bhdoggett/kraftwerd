<!--
  No double hyphens anywhere in these comments: XML forbids them.

  The Android app icon's back layer: the favicon's board, the dark squares
  and the Pacific grid between them, at the scale of the tile drawn over it
  by app-icon-foreground.svg. Both layers share the one transform, so the
  tile lands exactly in its square.

  It fills the whole 108 square: Android may shift either layer a little to
  animate it, and any edge left bare would show.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <rect width="108" height="108" fill="#0d373d"/>
  <g transform="translate(31 31) scale(0.328571) translate(-20 -20)" fill="#060608">
    <rect x="-124" y="-124" width="140" height="140"/>
    <rect x="20" y="-124" width="140" height="140"/>
    <rect x="164" y="-124" width="140" height="140"/>
    <rect x="-124" y="20" width="140" height="140"/>
    <rect x="20" y="20" width="140" height="140"/>
    <rect x="164" y="20" width="140" height="140"/>
    <rect x="-124" y="164" width="140" height="140"/>
    <rect x="20" y="164" width="140" height="140"/>
    <rect x="164" y="164" width="140" height="140"/>
  </g>
</svg>
