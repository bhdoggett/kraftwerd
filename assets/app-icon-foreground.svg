<!--
  No double hyphens anywhere in these comments: XML forbids them.

  The Android app icon's front layer: the favicon's K tile on its own, on
  nothing. Android draws it over app-icon-background.svg and then cuts both
  to whatever shape the phone uses, from a circle to a squircle.

  In Android's units: a 108 square, of which a launcher shows at most the
  middle 72, and promises only a circle 66 across. The tile is 46 square so
  its corners, 65 apart, stay inside that circle on every phone.

  The drawing is public/favicon.svg's tile, copied, and placed by the one
  transform below: its 140 square at (20, 20) becomes 46 at (31, 31). Change
  the favicon's tile and change this with it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <g transform="translate(31 31) scale(0.328571) translate(-20 -20)">
    <rect x="20" y="20" width="140" height="140" fill="#000000"/>
    <rect x="32" y="32" width="116" height="116" fill="#fed766"/>
    <path transform="translate(54.686 120) scale(0.085714 -0.085714)" fill="#0b0b0d"
          d="M214 205 170 350 516 700H719ZM87 0V700H258V0ZM537 0 278 342 393 441 737 0Z"/>
  </g>
</svg>
